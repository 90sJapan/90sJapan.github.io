<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRMSN — music</title>
<meta name="description" content="Official site and music for CRMSN.">
<script>
  // Apply the saved design before first paint so there's no flash of the other theme.
  try { var t = localStorage.getItem('crmsn-theme'); if (t === 'y2k') document.documentElement.dataset.theme = 'y2k'; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&family=Orbitron:wght@500;700;900&family=Audiowide&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="y2k.css">
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<div class="grain"></div>
<div class="y2k-grid" aria-hidden="true"></div>
<div class="y2k-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<header>
  <a href="#top" class="logo-mark">CRMSN</a>
  <nav class="primary-nav">
    <a href="#music">Music</a>
    <a href="https://soundcloud.com/officialcrmsn" target="_blank" rel="noopener">SoundCloud</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" title="Switch design">
      <span class="theme-toggle-label">Y2K mode</span>
    </button>
  </nav>
</header>

<main id="top">

  <section class="hero">
    <h1 class="chrome-text">CRMSN</h1>
    <div class="cta-row">
      <a href="#music" class="btn btn-glow">Listen now</a>
    </div>
  </section>

  <section id="music">
    <div class="wrap">
      <div class="section-head">
        <h2>Latest tracks</h2>
        <p>Streaming straight from SoundCloud — this list updates itself whenever a new track goes up.</p>
      </div>
      <div class="sc-embed-wrap">
        <div class="y2k-titlebar" aria-hidden="true">
          <span class="y2k-titlebar-text">crmsn_player.exe</span>
          <span class="y2k-titlebar-btns"><i></i><i></i><i></i></span>
        </div>
        <iframe class="sc-frame" title="CRMSN on SoundCloud" scrolling="no" frameborder="no" allow="autoplay"
          src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fofficialcrmsn&color=%23ff3ea5&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=true">
        </iframe>
      </div>
      <a class="sc-full-link" href="https://soundcloud.com/officialcrmsn" target="_blank" rel="noopener">Full catalog on SoundCloud</a>
    </div>
  </section>

</main>

<footer class="contact" id="contact">
  <div>
    <p class="logo-mark" style="font-size:1.4rem;">CRMSN</p>
  </div>
  <div class="contact-links">
    <a href="https://soundcloud.com/officialcrmsn" target="_blank" rel="noopener">SoundCloud</a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
